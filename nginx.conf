# Configuration Nginx pour Double B Restaurant
# Optimisations SEO et Performance

server {
    listen 80;
    server_name www.doubleb-restaurant.fr;
    return 301 https://doubleb-restaurant.fr$request_uri;
}

server {
    listen 80;
    server_name doubleb-restaurant.fr;
    return 301 https://doubleb-restaurant.fr$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.doubleb-restaurant.fr;
    return 301 https://doubleb-restaurant.fr$request_uri;
    
    # SSL Configuration
    ssl_certificate /path/to/certificate.crt;
    ssl_certificate_key /path/to/private.key;
}

server {
    listen 443 ssl http2;
    server_name doubleb-restaurant.fr;
    
    root /var/www/doubleb;
    index index_Version2.html;
    
    # SSL Configuration
    ssl_certificate /path/to/certificate.crt;
    ssl_certificate_key /path/to/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private no_last_modified no_etag auth;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;
    
    # Browser Caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Service Worker cache
    location = /sw.js {
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    
    # Manifest.json
    location = /manifest.json {
        expires 7d;
        add_header Cache-Control "public";
    }
    
    # Robots.txt
    location = /robots.txt {
        expires 7d;
        add_header Cache-Control "public";
    }
    
    # Sitemap.xml
    location = /sitemap.xml {
        expires 7d;
        add_header Cache-Control "public";
    }
    
    # Main HTML file
    location / {
        try_files $uri $uri/ /index_Version2.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
    
    # Handle 404 errors
    error_page 404 /index_Version2.html;
    
    # Log files
    access_log /var/log/nginx/doubleb_access.log;
    error_log /var/log/nginx/doubleb_error.log;
}